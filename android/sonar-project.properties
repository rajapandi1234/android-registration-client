# SonarQube Project Configuration
# These properties can be overridden via environment variables or Gradle build files

# Project identification
sonar.projectKey=rajapandi1234_android-registration-client
sonar.organization=test-integrations

# SonarCloud server URL
sonar.host.url=${SONAR_HOST_URL}

# Authentication token (should be set via environment variable SONAR_TOKEN)
# Never commit actual tokens to version control

# Source code configuration
sonar.sources=app/src/main/java,clientmanager/src/main/java,keymanager/src/main/java,packetmanager/src/main/java,transliterationmanager/src/main/java
sonar.java.binaries=build/intermediates/javac/debug
sonar.java.source=1.8
sonar.java.target=1.8

# Test configuration
sonar.tests=app/src/test/java,clientmanager/src/test/java,keymanager/src/test/java,packetmanager/src/test/java,transliterationmanager/src/test/java
sonar.junit.reportPaths=build/test-results/testDebugUnitTest

# Coverage configuration
sonar.coverage.jacoco.xmlReportPaths=build/clientmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml,build/keymanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml,build/packetmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml,build/transliterationmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml

# Exclusions
sonar.exclusions=**/src/androidTest/assets/**,**/AppData/Local/Pub/Cache/**,**/app/src/**

# Android Lint reports
sonar.androidLint.reportPaths=**/reports/lint-results-debug.xml
