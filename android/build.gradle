buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "com.ibotta:plugin:1.2.0"
        //Jacoco Plugin
        classpath "org.jacoco:org.jacoco.core:0.8.12"
    }
}

plugins {
    id "org.sonarqube" version "6.0.1.5171"
    id "jacoco"
}

sonarqube {
    androidVariant 'debug'
    properties {
        property "sonar.projectKey", "rajapandi1234_android-registration-client"
        property "sonar.organization", "test-integrations"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "https://sonarcloud.io"
        property "sonar.login", System.getenv("SONAR_TOKEN") ?: ""
        property "sonar.androidLint.reportPaths", "**/reports/lint-results-debug.xml"

        property "sonar.exclusions", "**/src/androidTest/assets/**,**/AppData/Local/Pub/Cache/**,**/app/src/**"
        property "sonar.java.binaries", "build/intermediates/javac/debug"
        property "sonar.junit.reportPaths", "build/test-results/testDebugUnitTest"
        // Coverage report paths - using relative paths that work in CI
        def coveragePaths = [
            "build/clientmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml",
            "build/keymanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml",
            "build/packetmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml",
            "build/transliterationmanager/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml"
        ].join(",")
        property "sonar.coverage.jacoco.xmlReportPaths", coveragePaths
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    }
}

ext {
    compileSdkVersion = 33
    buildToolsVersion = "33.0.0"

    minSdkVersion = 28
    targetSdkVersion = 33

    junitVersion = "4.+"

    // clientmanager Library Info
    clientmanagerLibVersionCode = 1
    clientmanagerLibVersionName = "\"1.0.0\""

    serverBaseURL = "\"https://api-internal.sandbox.xyz.net\""
    serverHealthCheckPath = "\"/v1/syncdata/actuator/health\""
    serverActuatorInfoPath = "\"/v1/syncdata/actuator/info\""
    debugPassword = "\"APTyKejHxACQyKBSRciR\""
    httpReadTimeout = 60000L
    httpWriteTimeout = 60000L
}


rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
