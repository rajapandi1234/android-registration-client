name: Sonar

on:
  workflow_dispatch:
    inputs:
      serverBaseURL:
        description: "Enter serverBaseURL for APK"
        required: true
        default: "https://api.default.example.com"
        type: string
  push:
    branches:
      - release*
      - develop

jobs:
  build-and-sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Replace serverBaseURL in all build.gradle files
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          find android -type f -name "build.gradle*" -print0 \
          | xargs -0 sed -i "s#api-internal.sandbox.xyz.net#${{ github.event.inputs.serverBaseURL }}#g"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.10.4
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ✅ REQUIRED for Gradle (fixes local.properties error)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean

      - name: Generate Pigeon / source folders
        run: sh pigeon.sh

      # ✅ DEBUG build only → NO SIGNING
      # This compiles ALL Android Java/Kotlin production code
      - name: Build Android APK (DEBUG – no signing)
        run: flutter build apk --debug

      # ✅ Same commands you run locally (tests optional but kept)
      - name: Run unit tests & coverage
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest \
            --no-daemon

      # ✅ Sonar: reuse compiled classes, DO NOT recompile
      - name: SonarQube Scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes \
            -Dsonar.gradle.skipCompile=true \
            --no-daemon
