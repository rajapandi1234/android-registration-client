name: Android CI – Debug + Sonar (No Signing)

on:
  workflow_dispatch:
    inputs:
      serverBaseURL:
        description: "Enter serverBaseURL"
        required: false
        default: "https://api.default.example.com"
  push:
    branches:
      - develop
      - release*

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.10.4'

# -------------------------------
# JOB 1: PREPARE ENVIRONMENT
# -------------------------------
jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Replace serverBaseURL (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          find android -type f -name "build.gradle*" -print0 \
          | xargs -0 sed -i "s#api-internal.sandbox.xyz.net#${{ inputs.serverBaseURL }}#g"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean

      - name: Generate pigeon sources
        run: sh pigeon.sh

# -------------------------------
# JOB 2: COMPILE DEBUG (NO RELEASE)
# -------------------------------
  compile-debug:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compile Debug Java/Kotlin ONLY
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            compileDebugJavaWithJavac \
            compileDebugKotlin \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest \
            --no-daemon

# -------------------------------
# JOB 3: TESTS + COVERAGE
# -------------------------------
  tests-coverage:
    runs-on: ubuntu-latest
    needs: compile-debug

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Unit Tests & JaCoCo
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            testDebugUnitTest \
            jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest \
            --no-daemon

# -------------------------------
# JOB 4: SONARQUBE ANALYSIS
# -------------------------------
  sonar:
    runs-on: ubuntu-latest
    needs: tests-coverage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: SonarQube Scan (DEBUG only)
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          chmod +x gradlew
          ./gradlew sonarqube \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes \
            -Dsonar.gradle.skipCompile=true \
            -x assemble \
            -x assembleRelease \
            --no-daemon

# -------------------------------
# JOB 5 (OPTIONAL): APK RELEASE
# -------------------------------
  apk-release:
    if: false   # enable only when needed
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.JKS_PRIVATE_SECRET }}" | base64 --decode > android/app/release.jks
          echo "${{ secrets.KEY_PROPERTIES }}" | base64 --decode > android/key.properties

      - name: Build signed APK
        run: flutter build apk --release
