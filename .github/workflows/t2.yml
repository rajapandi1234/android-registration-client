name: Android Build + Sonar

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------
  # 1️⃣ FLUTTER CODEGEN
  # -----------------------------
  flutter_codegen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Dart code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Upload generated Dart files
        uses: actions/upload-artifact@v4
        with:
          name: flutter-generated
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/pigeon/**

  # -----------------------------
  # 2️⃣ ANDROID COMPILE (CRITICAL)
  # -----------------------------
  android_compile:
    runs-on: ubuntu-latest
    needs: flutter_codegen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Download generated Dart files
        uses: actions/download-artifact@v4
        with:
          name: flutter-generated

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Compile Java (produces .class files)
        working-directory: android
        run: ./gradlew compileDebugJavaWithJavac

      # ✅ Archive compiled Java classes for Sonar
      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: android-classes
          path: |
            android/app/build/intermediates/javac/debug/classes
            android/app/build/tmp/kotlin-classes/debug

  # -----------------------------
  # 3️⃣ SONAR SCAN (AFTER COMPILE)
  # -----------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: android_compile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: android-classes
          path: android/app/build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run SonarQube scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes
