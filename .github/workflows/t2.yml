name: Android Build + SonarQube

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.16.5"
  JAVA_VERSION: "17"

# --------------------------------------------------
# 1️⃣ FLUTTER CODE GENERATION
# --------------------------------------------------
jobs:
  flutter_codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Upload generated Dart sources
        uses: actions/upload-artifact@v4
        with:
          name: flutter-generated
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/pigeon/**
            .dart_tool
            pubspec.lock

# --------------------------------------------------
# 2️⃣ ANDROID BUILD + JAVA COMPILE (CRITICAL)
# --------------------------------------------------
  android_compile:
    runs-on: ubuntu-latest
    needs: flutter_codegen

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore generated Dart files
        uses: actions/download-artifact@v4
        with:
          name: flutter-generated
          path: .

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get (sync deps)
        run: flutter pub get

      # 🔥 REQUIRED: Flutter must build successfully before Gradle
      - name: Flutter build (debug)
        run: flutter build apk --debug --no-shrink

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ✅ This now succeeds because Flutter already built
      - name: Compile Java classes
        working-directory: android
        run: ./gradlew compileDebugJavaWithJavac --no-daemon

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: android-classes
          path: |
            android/app/build/intermediates/javac/debug/classes
            android/app/build/tmp/kotlin-classes/debug

# --------------------------------------------------
# 3️⃣ SONARQUBE ANALYSIS
# --------------------------------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: android_compile

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: android-classes
          path: android/app/build

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run SonarQube scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes
