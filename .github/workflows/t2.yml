name: Android Build + Sonar

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

jobs:
  # --------------------------------------------------
  # 1️⃣ FLUTTER CODEGEN (PIGEON + FREEZED + JSON)
  # --------------------------------------------------
  flutter_codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔒 Validate Flutter (prevents /packages/flutter_tools error)
      - name: Verify Flutter SDK
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          test -d "$FLUTTER_ROOT/packages/flutter_tools/gradle"
          ls $FLUTTER_ROOT/packages/flutter_tools/gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Dart code (build_runner + pigeon)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Upload generated Dart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-generated
          if-no-files-found: error
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/pigeon/**

  # --------------------------------------------------
  # 2️⃣ ANDROID COMPILE (PRODUCES .class FILES)
  # --------------------------------------------------
  android_compile:
    runs-on: ubuntu-latest
    needs: flutter_codegen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🔒 Validate Flutter again (job isolation)
      - name: Verify Flutter SDK
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          test -d "$FLUTTER_ROOT/packages/flutter_tools/gradle"
          ls $FLUTTER_ROOT/packages/flutter_tools/gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          cat android/local.properties

      - name: Download generated Dart artifacts
        uses: actions/download-artifact@v4
        with:
          name: flutter-generated
          path: .

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 🎯 This is the critical step for Sonar
      - name: Compile Java (produces .class files)
        working-directory: android
        run: ./gradlew compileDebugJavaWithJavac --no-daemon --stacktrace

      - name: Upload compiled Java/Kotlin classes
        uses: actions/upload-artifact@v4
        with:
          name: android-classes
          if-no-files-found: error
          path: |
            android/app/build/intermediates/javac/debug/classes
            android/app/build/tmp/kotlin-classes/debug

  # --------------------------------------------------
  # 3️⃣ SONAR SCAN (USES COMPILED CLASSES)
  # --------------------------------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: android_compile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: android-classes
          path: android/app/build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Run SonarQube scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonarqube \
            --no-daemon \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes,app/build/tmp/kotlin-classes/debug
