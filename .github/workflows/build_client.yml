name: Android Registration Client - Sonar

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------
      # JAVA + FLUTTER SETUP
      # ----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.10.4"
          cache: true

      - uses: android-actions/setup-android@v3

      # ----------------------------
      # FLUTTER PREP
      # ----------------------------
      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter clean
        run: flutter clean

      - name: Generate pigeon sources
        run: sh pigeon.sh

      # ----------------------------
      # ANDROID COMPILE (NO APK)
      # ----------------------------
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Compile Android Java & Kotlin (NO SIGNING)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew \
            compileDebugJavaWithJavac \
            compileDebugKotlin \
            testDebugUnitTest \
            jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest \
            --no-daemon

      # ----------------------------
      # SONARQUBE
      # ----------------------------
      - name: SonarQube Scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes \
            --no-daemon
