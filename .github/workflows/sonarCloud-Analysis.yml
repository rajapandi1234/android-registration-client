name: SonarCloud Analysis

on:
  push:
    branches:
      - develop
      - release*
  pull_request:
    branches:
      - develop
      - release*
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17 (Required for Gradle & Sonar)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.4'

      # 4. Install Flutter dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. NEW: Generate Pigeon, Freezed, and JSON files
      # This fixes the "lib/pigeon/user_pigeon.dart: No such file" errors
      - name: Generate missing files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 6. NEW: Ensure Android SDK 34 is available
      # This fixes the plugin requirement warning for flutter_secure_storage
      - name: Setup Android SDK 34
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 7. Generate Flutter Android intermediates
      - name: Generate Flutter Android intermediates
        run: flutter build apk --debug --no-pub

      # 8. Grant execute permission to gradlew
      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # 9. Run unit tests with coverage
      - name: Run Unit Tests with Coverage
        working-directory: android
        run: |
          ./gradlew testDebugUnitTestCoverage \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      # 10. Generate Jacoco XML report
      - name: Generate Jacoco Test Report
        working-directory: android
        run: |
          ./gradlew jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      # 11. Run SonarCloud analysis
      - name: Run SonarCloud Analysis
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=test-integrations \
            -Dsonar.projectKey=rajapandi1234_android-registration-client \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml \
            -Dsonar.exclusions=**/image_picker_android/**,**/webview_flutter_android/**
