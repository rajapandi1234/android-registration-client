name: SonarCloud Analysis

on:
  push:
    branches:
      - develop
      - release*
  pull_request:
    branches:
      - develop
      - release*
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required by Sonar

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.4'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: android

      - name: Run Unit Tests with Coverage
        working-directory: android
        run: |
          ./gradlew testDebugUnitTestCoverage \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      - name: Generate JaCoCo Report
        working-directory: android
        run: |
          ./gradlew jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      - name: SonarCloud Scan
        working-directory: android
        env:
          SONAR_TOKEN: 13c9437b3fa54b66de5ec14c4fc2bd04fb55ae77
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=test-integrations \
            -Dsonar.projectKey=rajapandi1234_android-registration-client\
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest
