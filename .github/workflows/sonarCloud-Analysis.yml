name: SonarCloud Analysis

on:
  push:
    branches:
      - develop
      - release*
  pull_request:
    branches:
      - develop
      - release*
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Java (required by Gradle & Sonar)
      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 17

      # Flutter (required to generate Android intermediates)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.4'

      - name: Install Flutter dependencies
        run: flutter pub get

      # IMPORTANT: This generates libs.jar required by Android + Sonar
      - name: Generate Flutter Android intermediates
        run: flutter build apk --debug --no-pub

      # Gradle wrapper permission
      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      # SonarCloud analysis (skip tests, keep Android analysis)
      - name: Run SonarCloud Analysis
        working-directory: android
        env:
          SONAR_TOKEN: 13c9437b3fa54b66de5ec14c4fc2bd04fb55ae77
        run: |
          ./gradlew sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=test-integrations \
            -Dsonar.projectKey=rajapandi1234_android-registration-client \
            -x testDebugUnitTest \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest
