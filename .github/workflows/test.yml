name: Android Registration Client CI

on:
  push:
    branches: [ develop, release* ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Java (required for Gradle + Sonar)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          cache: true

      # 4️⃣ Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5️⃣ Generate local.properties (CRITICAL)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> android/local.properties

      # 6️⃣ Flutter dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7️⃣ Compile Java only (optional)
      - name: Compile Java sources
        working-directory: android
        run: ./gradlew compileDebugJavaWithJavac

      # 8️⃣ Full Android build (recommended)
      - name: Build Android
        run: ./gradlew assembleDebug

      # 9️⃣ Unit tests
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
