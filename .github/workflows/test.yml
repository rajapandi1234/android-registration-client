name: Android Registration Client CI

on:
  push:
    branches:
      - develop
      - release*
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.17-10/x64

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (required for Gradle + Android)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.5"
          cache: true

      # 4️⃣ Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5️⃣ Create android/local.properties (CRITICAL)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_HOME" >> android/local.properties

      # 6️⃣ Install Flutter dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7️⃣ Generate code (freezed, json_serializable, etc.)
      - name: Generate Dart code (build_runner)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 🔁 If your project uses explicit pigeon commands, add them here
      # - name: Generate Pigeon files
      #   run: flutter pub run pigeon --input pigeons/xxx.dart ...

      # 8️⃣ Ensure gradlew is executable (Linux CI fix)
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 9️⃣ Compile Java sources (Android)
      - name: Compile Java sources
        working-directory: android
        run: ./gradlew compileDebugJavaWithJavac

      # 🔟 (Optional) Full Android build
      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 1️⃣1️⃣ (Optional) Unit tests
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
