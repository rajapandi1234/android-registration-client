name: Android Unit Test + SonarQube

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.16.5"

# --------------------------------------------------
# 1️⃣ PREPARE ENV (Flutter + Android)
# --------------------------------------------------
jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .

# --------------------------------------------------
# 2️⃣ UNIT TESTS + JAVA COMPILE (NO FLUTTER BUILD)
# --------------------------------------------------
  android_tests:
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace
          path: .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ✅ SAME AS LOCAL
      - name: Run unit tests + compile Java
        working-directory: android
        run: |
          ./gradlew testDebugUnitTestCoverage \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            android/app/build
            android/build

# --------------------------------------------------
# 3️⃣ JACOCO + SONARQUBE
# --------------------------------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: android_tests

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: android

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate JaCoCo report
        working-directory: android
        run: |
          ./gradlew jacocoTestReport \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest

      - name: Run SonarQube scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes \
            -x image_picker_android:testDebugUnitTest \
            -x webview_flutter_android:testDebugUnitTest
