name: Android Build + Sonar

on:
  push:
    branches: [ develop, release* ]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.16.5"
  JAVA_VERSION: "17"

# -----------------------------
# 1️⃣ FLUTTER SETUP + CODEGEN
# -----------------------------
jobs:
  flutter_codegen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Dart code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Upload generated Dart files
        uses: actions/upload-artifact@v4
        with:
          name: flutter-generated
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
            lib/pigeon/**

# -----------------------------
# 2️⃣ ANDROID BUILD (JAVA + KOTLIN)
# -----------------------------
  android_build:
    runs-on: ubuntu-latest
    needs: flutter_codegen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Download generated Dart files
        uses: actions/download-artifact@v4
        with:
          name: flutter-generated

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 🔑 This step CONFIGURES Flutter plugins correctly
      - name: Flutter Android prebuild
        run: flutter build apk --debug

      # 🔑 Matches your LOCAL working command
      - name: Run tests with coverage
        working-directory: android
        run: |
          ./gradlew testDebugUnitTestCoverage

      - name: Generate JaCoCo report
        working-directory: android
        run: |
          ./gradlew jacocoTestReport

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: android-classes
          path: |
            android/app/build/intermediates/javac/debug/classes
            android/app/build/tmp/kotlin-classes/debug

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: android/app/build/reports/jacoco

# -----------------------------
# 3️⃣ SONAR SCAN
# -----------------------------
  sonar_scan:
    runs-on: ubuntu-latest
    needs: android_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: android-classes
          path: android/app/build

      - name: Download JaCoCo report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: android/app/build/reports/jacoco

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ❗ NO plugin exclusions here — they were wrong
      - name: Run SonarQube scan
        working-directory: android
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.java.binaries=app/build/intermediates/javac/debug/classes \
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
